name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;34.0.0'

      # 本地 wrapper 配置的腾讯镜像 distributionUrl 已失效（HTTP 567）。
      # CI 环境将其替换为官方地址，仅作用于本次 checkout，不影响仓库内文件。
      - name: Point Gradle wrapper at official distribution
        run: |
          sed -i 's|mirrors.cloud.tencent.com/gradle/gradle-9.1.0-bin.zip|services.gradle.org/distributions/gradle-9.1.0-bin.zip|' \
            app/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl app/gradle/wrapper/gradle-wrapper.properties

      - name: Make gradlew executable
        run: chmod +x app/gradlew

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: app

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: gyyz-release-apk
          path: app/app/build/outputs/apk/release/*.apk
          retention-days: 30
